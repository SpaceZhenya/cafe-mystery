<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery of the Night Cafe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: #0a0a0a;
            color: #e8e4dc;
            overflow: hidden;
            height: 100vh;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 3px;
        }
        
        .inventory {
            display: flex;
            gap: 15px;
        }
        
        .inventory-item {
            width: 50px;
            height: 50px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(20, 15, 10, 0.8);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .inventory-item:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: linear-gradient(135deg, rgba(15, 12, 8, 0.95), rgba(30, 22, 15, 0.9));
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 25px 35px;
            pointer-events: auto;
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            transition: all 0.4s ease-out;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(212, 175, 55, 0.1);
        }
        
        .dialogue-box.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .speaker-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .speaker-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2a2015, #1a1510);
        }
        
        .dialogue-text {
            font-size: 17px;
            line-height: 1.7;
            color: #c8c4bc;
            margin-bottom: 20px;
            min-height: 60px;
        }
        
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .choice-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #e8e4dc;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            font-family: 'Source Sans Pro', sans-serif;
        }
        
        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.15));
            border-color: #d4af37;
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        
        .npc-status {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }
        
        .npc-card {
            background: rgba(15, 12, 8, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease-out;
        }
        
        .npc-card.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .npc-card-name {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: #d4af37;
            margin-bottom: 8px;
        }
        
        .npc-card-relation {
            font-size: 13px;
            color: #8a847a;
        }
        
        .relation-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .relation-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b4513, #d4af37);
            border-radius: 2px;
            transition: width 0.5s ease-out;
        }
        
        .intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1510 0%, #0a0806 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }
        
        .intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            color: #d4af37;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            letter-spacing: 8px;
        }
        
        .intro-subtitle {
            font-size: 18px;
            color: #8a847a;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }
        
        .start-btn {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #d4af37;
            background: transparent;
            border: 2px solid #d4af37;
            padding: 15px 50px;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.4s;
        }
        
        .start-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: scale(1.05);
        }
        
        .intro-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        
        .continue-btn {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #d4af37;
            background: transparent;
            border: 2px solid #d4af37;
            padding: 15px 50px;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.4s;
        }
        
        .continue-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: scale(1.05);
        }
        
        .reset-btn {
            font-family: 'Source Sans Pro', sans-serif;
            font-size: 13px;
            color: #6a655d;
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 8px 25px;
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            color: #c0392b;
            border-color: #c0392b;
        }
        
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(30, 22, 15, 0.95));
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 30px 50px;
            text-align: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s;
        }
        
        .notification.visible {
            opacity: 1;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); }
        }
        
        .notification-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #d4af37;
        }
        
        .hint-text {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #5a554d;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .click-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #6a655d;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .click-hint.visible {
            opacity: 1;
        }

        .chapter-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4af37;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.6), 0 0 80px rgba(100, 0, 150, 0.3);
            letter-spacing: 6px;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 2s ease-out;
            text-align: center;
        }

        .chapter-title.visible {
            opacity: 1;
        }

        .chapter-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s;
        }

        .chapter-indicator.visible {
            opacity: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(20, 10, 0, 0.7) 100%);
            z-index: 10;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            z-index: 11;
            opacity: 0.3;
        }

        /* Mobile controls */
        .mobile-controls {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .mobile-controls.visible {
            opacity: 1;
        }
        .mobile-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.3);
            background: rgba(15, 12, 8, 0.6);
            color: #d4af37;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: none;
        }
        .mobile-btn:active {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }
        .mobile-hint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: #6a655d;
            font-size: 12px;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            letter-spacing: 1px;
        }
        .mobile-hint.visible {
            opacity: 0.7;
        }
        @media (min-width: 769px) {
            .mobile-controls, .mobile-hint { display: none; }
        }

        /* Mobile NPC name list on the left */
        .mobile-npc-list {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        .mobile-npc-list.visible {
            opacity: 1;
        }
        .mobile-npc-item {
            background: rgba(15, 12, 8, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            min-width: 90px;
            pointer-events: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            transition: all 0.2s;
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: #d4af37;
            letter-spacing: 1px;
            text-align: left;
        }
        .mobile-npc-item:active {
            background: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
            transform: scale(1.05);
        }

        /* Landscape / small screen fixes */
        @media (max-height: 500px) {
            .top-bar { padding: 5px 0; }
            .game-title { font-size: 16px; }
            .inventory-item { width: 36px; height: 36px; font-size: 16px; }
            .npc-status { right: 10px; gap: 6px; }
            .npc-card { width: 120px; padding: 8px 10px; }
            .npc-card-name { font-size: 12px; margin-bottom: 4px; }
            .npc-card-relation { font-size: 10px; }
            .relation-bar { height: 3px; margin-top: 4px; }
            .dialogue-box {
                width: 90%;
                bottom: 5px;
                padding: 12px 18px;
            }
            .dialogue-text { font-size: 14px; line-height: 1.4; min-height: 30px; }
            .choice-btn { padding: 8px 14px; font-size: 13px; }
            .speaker-name { font-size: 16px; margin-bottom: 6px; }
            .speaker-avatar { width: 28px; height: 28px; }
            .mobile-controls { bottom: 50px; gap: 20px; }
            .mobile-btn { width: 44px; height: 44px; font-size: 18px; }
            .mobile-hint { bottom: 100px; font-size: 10px; }
            .mobile-npc-list { left: 8px; gap: 5px; }
            .mobile-npc-item { padding: 6px 10px; min-width: 70px; font-size: 12px; }
            .chapter-title { font-size: 20px; }
            .vignette { background: radial-gradient(circle, transparent 20%, rgba(20, 10, 0, 0.6) 100%); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        <div class="vignette"></div>
        <div class="scanlines"></div>
        
        <div class="mobile-hint" id="mobile-hint">←  Swipe or tap arrows to look around  →</div>
        <div class="mobile-controls" id="mobile-controls">
            <button class="mobile-btn" id="btn-left">◀</button>
            <button class="mobile-btn" id="btn-right">▶</button>
        </div>
        <div class="mobile-npc-list" id="mobile-npc-list"></div>
        
        <div class="intro-screen" id="intro">
            <div class="intro-title">MYSTERY</div>
            <div class="intro-subtitle">OF THE NIGHT CAFE</div>
            <div class="intro-buttons" id="intro-buttons">
                <button class="start-btn" id="btn-start" onclick="startGame()">START</button>
            </div>
        </div>
        
        <div id="ui-overlay">
            <div class="top-bar">
                <div class="game-title">MYSTERY OF THE NIGHT CAFE</div>
                <div class="inventory" id="inventory"></div>
            </div>
            
            <div class="npc-status" id="npc-status"></div>
            
            <div class="dialogue-box" id="dialogue-box">
                <div class="speaker-name">
                    <div class="speaker-avatar"></div>
                    <span id="speaker-name">Name</span>
                </div>
                <div class="dialogue-text" id="dialogue-text">Dialogue text...</div>
                <div class="choices" id="choices"></div>
            </div>
            
            <div class="click-hint" id="click-hint">Click on a character to talk</div>
        </div>
        
        <div class="notification" id="notification">
            <div class="notification-text" id="notification-text"></div>
        </div>

        <div class="chapter-title" id="chapter-title"></div>
        <div class="chapter-indicator" id="chapter-indicator">Chapter 1: Night Cafe</div>
        
        <div class="loading" id="loading">LOADING...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script>
        // Game State
        let scene, camera, renderer, clock;
        let npcs = [];
        let selectedNPC = null;
        let gameStarted = false;
        
        const gameState = {
            relationships: {},
            inventory: [],
            collectedItems: [],
            cluesFound: 0,
            talkedTo: {},
            talkedToCh2: {},
            day: 1,
            chapter: 1,
            ending: null,
            sergeyRescued: false,
            basementSecretFound: false
        };
        
        // Save / Load System
        const SAVE_KEY = 'cafe_mystery_save';
        
        function saveGame() {
            try {
                const data = JSON.stringify(gameState);
                localStorage.setItem(SAVE_KEY, data);
            } catch(e) {
                console.warn('Save failed:', e);
            }
        }
        
        function loadGame() {
            try {
                const data = localStorage.getItem(SAVE_KEY);
                if (!data) return false;
                const saved = JSON.parse(data);
                Object.assign(gameState, saved);
                return true;
            } catch(e) {
                console.warn('Load failed:', e);
                return false;
            }
        }
        
        function resetGame() {
            localStorage.removeItem(SAVE_KEY);
            location.reload();
        }
        
        function hasSave() {
            return localStorage.getItem(SAVE_KEY) !== null;
        }
        
        function continueGame() {
            if (!loadGame()) {
                startGame();
                return;
            }
            document.getElementById('intro').classList.add('hidden');
            gameStarted = true;
            initAudio();
            createMobileNPCList();
            updateInventory();
            updateNPCStatus();
            
            if (gameState.chapter === 2) {
                document.getElementById('chapter-indicator').textContent = 'Chapter 2: The Basement of Marcus';
                document.getElementById('chapter-indicator').classList.add('visible');
            } else {
                document.getElementById('chapter-indicator').textContent = 'Chapter 1: Night Cafe';
                document.getElementById('chapter-indicator').classList.add('visible');
            }
        }

        function autoSave() {
            if (gameStarted) saveGame();
        }
        
        // Input and Audio
        let playerAngle = 0;
        const keys = { a: false, d: false };

        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        // Touch controls for mobile
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoved = false;
        let touchId = null;

        window.addEventListener('touchstart', (e) => {
            if (!gameStarted) return;
            if (document.getElementById('dialogue-box').classList.contains('visible')) return;
            const touch = e.changedTouches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchMoved = false;
            touchId = touch.identifier;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (touchId === null) return;
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            const dx = touch.clientX - touchStartX;
            if (Math.abs(dx) > 5) {
                touchMoved = true;
                playerAngle += dx * 0.005;
                touchStartX = touch.clientX;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
            if (!touch) return;
            touchId = null;
            if (!touchMoved) {
                // Update mouse coordinates for the raycaster
                window.mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                window.mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                // Check if tapped on a UI element (dialogue, button) — handle natively
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                if (el && el.closest && (
                    el.closest('.dialogue-box') || 
                    el.closest('.mobile-btn') || 
                    el.closest('.choice-btn') || 
                    el.closest('.inventory-item') ||
                    el.closest('.notification') ||
                    el.id === 'intro'
                )) {
                    if (el.click) el.click();
                } else {
                    // Tap on the 3D scene — call click handler with updated mouse coords
                    onMouseClick();
                }
            }
        }, { passive: true });

        // Mobile arrow buttons
        window.addEventListener('load', () => {
            const btnL = document.getElementById('btn-left');
            const btnR = document.getElementById('btn-right');
            if (btnL && 'ontouchstart' in window) {
                document.getElementById('mobile-controls').classList.add('visible');
                document.getElementById('mobile-hint').classList.add('visible');
                setTimeout(() => {
                    document.getElementById('mobile-hint').classList.remove('visible');
                }, 6000);
            }
            if (!btnL) return;
            let lInterval, rInterval;
            const startRot = (dir) => {
                keys[dir] = true;
                const interval = setInterval(() => {}, 50);
                return interval;
            };
            btnL.addEventListener('touchstart', (e) => { e.preventDefault(); keys.a = true; });
            btnL.addEventListener('touchend', () => { keys.a = false; });
            btnL.addEventListener('touchcancel', () => { keys.a = false; });
            btnL.addEventListener('mousedown', () => { keys.a = true; });
            btnL.addEventListener('mouseup', () => { keys.a = false; });
            btnL.addEventListener('mouseleave', () => { keys.a = false; });
            btnR.addEventListener('touchstart', (e) => { e.preventDefault(); keys.d = true; });
            btnR.addEventListener('touchend', () => { keys.d = false; });
            btnR.addEventListener('touchcancel', () => { keys.d = false; });
            btnR.addEventListener('mousedown', () => { keys.d = true; });
            btnR.addEventListener('mouseup', () => { keys.d = false; });
            btnR.addEventListener('mouseleave', () => { keys.d = false; });
        });

        let audioContext;
        let masterGain;
        window.audioOscillators = [];
        window.isJazz = false;
        
        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.gain.value = 0.2;
                masterGain.connect(audioContext.destination);
                
                // Warm Cmaj7 chord
                const freqs = [130.81, 164.81, 196.00, 246.94]; 
                freqs.forEach(f => {
                    const osc = audioContext.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const panner = audioContext.createStereoPanner ? audioContext.createStereoPanner() : audioContext.createGain();
                    if (panner.pan) panner.pan.value = (Math.random() - 0.5) * 0.5;
                    
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400 + Math.random()*200;
                    
                    osc.connect(filter);
                    filter.connect(panner);
                    panner.connect(masterGain);
                    osc.start();
                    window.audioOscillators.push(osc);
                });

                // Fire crackle noise
                const bufferSize = audioContext.sampleRate * 2;
                const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() > 0.995 ? Math.random() * 2 - 1 : 0;
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;
                
                const noiseFilter = audioContext.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 1000;
                
                noise.connect(noiseFilter);
                noiseFilter.connect(masterGain);
                noise.start();
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        // Initialize Three.js scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a120c);
            scene.fog = new THREE.Fog(0x1a120c, 5, 20);
            
            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 1, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 2.5;
            container.appendChild(renderer.domElement);
            
            // Clock
            clock = new THREE.Clock();
            
            // Lighting
            setupLighting();
            
            // Room
            createRoom();
            
            // NPCs
            createNPCs();
            
            // Interactive items
            createInteractables();
            
            // Post-processing feel with particles
            createAmbientParticles();
            
            // Raycaster for interaction
            window.raycaster = new THREE.Raycaster();
            window.mouse = new THREE.Vector2();
            
            // Events
            window.addEventListener('resize', () => {
                onWindowResize();
                setTimeout(onWindowResize, 300);
            });
            window.addEventListener('orientationchange', () => {
                setTimeout(onWindowResize, 400);
            });
            renderer.domElement.addEventListener('click', onMouseClick);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            // Start animation
            animate();
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }
        
        function setupLighting() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x3a3020, 0.8);
            scene.add(ambient);
            
            // Hemisphere light for general fill
            const hemiLight = new THREE.HemisphereLight(0x5a4a35, 0x3a2a20, 0.8);
            scene.add(hemiLight);
            
            // Main warm light (chandelier)
            const mainLight = new THREE.SpotLight(0xffaa55, 5.0, 15, Math.PI / 3, 0.5, 1);
            mainLight.position.set(0, 5, 0);
            mainLight.castShadow = true;
            
            // Hearth / Fireplace light
            const hearthLight = new THREE.PointLight(0xff6600, 3.0, 10);
            hearthLight.position.set(-5, 1, -4);
            hearthLight.userData.isHearth = true;
            scene.add(hearthLight);
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);
            
            // Warm accent lights
            const accentPositions = [
                { x: -4, z: 2, color: 0xe8c884 },
                { x: 4, z: 2, color: 0xe8c884 },
                { x: 0, z: -3, color: 0xd4af37 },
                { x: -3, z: -2, color: 0xe8c884 },
                { x: 3, z: -2, color: 0xe8c884 }
            ];
            
            accentPositions.forEach(pos => {
                const light = new THREE.PointLight(pos.color, 2.5, 12);
                light.position.set(pos.x, 2.5, pos.z);
                scene.add(light);
            });
            
            // Candle lights
            for (let i = 0; i < 5; i++) {
                const candleLight = new THREE.PointLight(0xffaa55, 1.5, 5);
                candleLight.position.set(
                    Math.sin(i * 1.2) * 3,
                    0.8,
                    Math.cos(i * 1.2) * 2
                );
                scene.add(candleLight);
            }
            
            // Extra fill light
            const fillLight = new THREE.PointLight(0xc8b898, 2.0, 15);
            fillLight.position.set(0, 3, 0);
            scene.add(fillLight);
        }
        
        function createRoom() {
            // Floor with plank texture
            createFloorWithPlanks();
            
            // Cozy Rug
            const rugGeo = new THREE.PlaneGeometry(7, 5);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x5a2015, roughness: 1.0 });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.01, 0);
            scene.add(rug);
            
            // Window on the left wall
            const windowGeo = new THREE.PlaneGeometry(4, 3);
            const windowMat = new THREE.MeshStandardMaterial({ 
                color: 0x050a15, 
                roughness: 0.1, 
                metalness: 0.8,
                transparent: true,
                opacity: 0.5
            });
            const windowMesh = new THREE.Mesh(windowGeo, windowMat);
            windowMesh.position.set(-5.9, 3, 0);
            windowMesh.rotation.y = Math.PI / 2;
            scene.add(windowMesh);

            // Rain particles outside window
            const rainCount = 200;
            const rainGeo = new THREE.BufferGeometry();
            const rainPos = new Float32Array(rainCount * 3);
            for(let i=0; i<rainCount; i++) {
                rainPos[i*3] = -6.5 + Math.random();
                rainPos[i*3+1] = Math.random() * 6;
                rainPos[i*3+2] = (Math.random() - 0.5) * 5;
            }
            rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
            const rainMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, opacity: 0.6 });
            const rain = new THREE.Points(rainGeo, rainMat);
            rain.userData.isRain = true;
            scene.add(rain);

            // Lightning light
            const lightning = new THREE.PointLight(0xaaccff, 0, 20);
            lightning.position.set(-6, 4, 0);

            scene.add(lightning);
            
            // Walls

                color: 0x1a1510,

            // Back wall

            // Front wall (closes the room behind the camera)

            // Side walls

        // ===== Realism improvements =====
        function createCanvasTexture(width, height, drawFunc) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFunc(ctx, width, height);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createFloorWithPlanks() {
            // Remove old floor if exists (from previous implementations)
            const oldFloors = scene.children.filter(c => 
                c.isMesh && c.material && c.material.color && 
                c.material.color.getHex() === 0x2a1f15 && 
                c.geometry.type === 'PlaneGeometry' && 
                Math.abs(c.position.y) < 0.1
            );
            oldFloors.forEach(f => scene.remove(f));

            const plankTex = createCanvasTexture(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#2a1f15';
                ctx.fillRect(0, 0, w, h);
                // Plank lines
                ctx.strokeStyle = '#1a0f08';
                ctx.lineWidth = 2;
                const plankH = h / 12;
                for (let y = 0; y < h; y += plankH) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                    // Random plank end joints
                    for (let x = 0; x < w; x += 60 + Math.random() * 80) {
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x, y + plankH);
                        ctx.stroke();
                    }
                }
                // Wood grain
                ctx.strokeStyle = 'rgba(60, 40, 20, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 30; i++) {
                    const y = Math.random() * h;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    for (let x = 0; x < w; x += 20) {
                        ctx.lineTo(x, y + Math.sin(x * 0.05 + i) * 2);
                    }
                    ctx.stroke();
                }
            });
            plankTex.repeat.set(4, 4);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(24, 24),
                new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.8, metalness: 0.05 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

            const clothMat = new THREE.MeshStandardMaterial({ color: clothColor, roughness: 0.8 });

            head.scale.set(1.0, 1.15, 0.95);

        function collectItem(itemObj) {
            const itemName = itemObj.userData.name;
            if (!gameState.inventory.includes(itemName)) {
                gameState.inventory.push(itemName);
                gameState.collectedItems.push(itemObj.userData.id || itemName);
                updateInventory();
                showNotification(`You found: ${itemName}`);
                scene.remove(itemObj);
                autoSave();
            }
        }

        function triggerVision() {
            // Screen flash effect
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'rgba(255, 255, 255, 0.9)';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '9999';
            flash.style.transition = 'opacity 2.0s ease-out';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 2000);
            }, 50);

            // Change lighting to eerie purple
            scene.children.forEach(c => {
                if (c.isLight && !c.userData.isLightning) {
                    if (c.intensity > 1) {
                        c.color.setHex(0x5500aa); 
                    }
                }
            });

            // Make the hidden door appear behind the bar
            const doorGeo = new THREE.PlaneGeometry(1.8, 3.5);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x220000, emissive: 0x550000, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.5 });

            showNotification("The world has changed... You see the hidden.");

        function createAmbientParticles() {
            const particleCount = 100;
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 10;
                positions[i * 3 + 1] = Math.random() * 4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xd4a574,
                size: 0.03,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.userData.isParticles = true;
            scene.add(particles);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onMouseMove(event) {
            window.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            window.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Check for hover
            window.raycaster.setFromCamera(window.mouse, camera);
            const intersects = window.raycaster.intersectObjects(scene.children, true);
            
            let hoveringNPC = false;
            intersects.forEach(intersect => {
                if (intersect.object.parent && intersect.object.parent.userData && intersect.object.parent.userData.id) {
                    hoveringNPC = true;
                }
            });
            
            renderer.domElement.style.cursor = hoveringNPC ? 'pointer' : 'default';
        }
        
        function onMouseClick(event) {
            if (!gameStarted) return;
            
            window.raycaster.setFromCamera(window.mouse, camera);
            const intersects = window.raycaster.intersectObjects(scene.children, true);
            
            let clickedObject = null;
            intersects.forEach(intersect => {
                let obj = intersect.object;
                if (obj.parent && obj.parent.userData && obj.parent.userData.id) {
                    clickedObject = obj.parent;
                } else if (obj.userData && obj.userData.id) {
                    clickedObject = obj;
                }
            });
            
            if (clickedObject && clickedObject.userData) {
                const u = clickedObject.userData;
                if (u.id === 'gramophone') {
                    toggleMusic();
                } else if (u.isItem) {
                    collectItem(clickedObject);
                } else if (u.isDoor) {
                    showEnding();
                } else if (u.id === 'golden_sphere') {
                    showFinalChoice();
                } else if (u.id) {
                    startDialogue(u.id);
                }
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Animate NPCs
            npcs.forEach((npc, index) => {
                // Breathing animation
                const breathScale = 1 + Math.sin(time * 2 + index) * 0.005;
                npc.scale.y = breathScale;
                
                // Slight movement
                npc.position.x = npc.userData.basePosition.x + Math.sin(time * 0.5 + index * 2) * 0.02;
                
                // Look at camera/player
                if (npc.userData.lookAtPlayer && !npc.userData.talking) {
                    const targetLook = new THREE.Vector3(camera.position.x, 1.5, camera.position.z);
                    npc.lookAt(targetLook);
                }
                
                // Idle head movement
                const head = npc.children[0];
                if (head) {
                    head.rotation.y = Math.sin(time * 0.3 + index) * 0.1;
                }
                
                // Blinking animation
                if (!npc.userData.blinkTimer) npc.userData.blinkTimer = 3 + Math.random() * 5;
                if (!npc.userData.isBlinking) {
                    npc.userData.blinkTimer -= delta;
                    if (npc.userData.blinkTimer <= 0) {
                        npc.userData.isBlinking = true;
                        npc.userData.blinkPhase = 0;
                    }
                }
                if (npc.userData.isBlinking) {
                    npc.userData.blinkPhase += delta * 10;
                    const t = npc.userData.blinkPhase;
                    let lidScaleY;
                    if (t < 0.1) {
                        lidScaleY = 0.8 - (0.8 / 0.1) * t;
                    } else if (t < 0.2) {
                        lidScaleY = 0;
                    } else if (t < 0.3) {
                        lidScaleY = (0.8 / 0.1) * (t - 0.2);
                    } else {
                        lidScaleY = 0.8;
                        npc.userData.isBlinking = false;
                        npc.userData.blinkTimer = 3 + Math.random() * 5;
                    }
                    npc.children.forEach(child => {
                        if (child.userData && child.userData.isEyelid) {
                            child.scale.y = lidScaleY;
                            if (lidScaleY < 0.15) child.scale.y = 0.01;
                        }
                    });
                }
            });
            
            // Animate dynamic elements
            scene.children.forEach(child => {
                if (child.userData && child.userData.isParticles) {
                    const positions = child.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 1] += Math.sin(time + positions[i]) * 0.001;
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                    child.rotation.y = time * 0.05;
                }
                
                if (child.userData && child.userData.isHearth) {
                    child.intensity = 2.5 + Math.random() * 1.0;
                }
                
                if (child.userData && child.userData.isRain) {
                    const positions = child.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 1] -= delta * 6;
                        if (positions[i + 1] < 0) positions[i + 1] = 6;
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                }
                
                if (child.userData && child.userData.isLightning) {
                    if (Math.random() > 0.995) {
                        child.intensity = 5 + Math.random() * 15;
                    } else {
                        child.intensity = Math.max(0, child.intensity - delta * 50);
                    }
                }
                
                // Fireplace flame flicker
                if (child.userData && child.userData.isFire) {
                    const flicker = Math.sin(time * 5 + child.userData.phase) * 0.3 + 0.7;
                    child.scale.set(0.2 * flicker, 0.3 * flicker, 1);
                    child.position.y = child.userData.baseY + Math.sin(time * 6 + child.userData.phase) * 0.05;
                }
                
                // Candle flame flicker
                if (child.userData && child.userData.isFlame) {
                    const flicker = Math.sin(time * 8 + child.userData.phase) * 0.2 + 0.8;
                    child.scale.setScalar(flicker);
                    child.position.y = child.userData.baseY + Math.sin(time * 7 + child.userData.phase) * 0.02;
                }
                
                // Fireplace light flicker
                if (child.userData && child.userData.isFireLight) {
                    child.intensity = 1.5 + Math.sin(time * 6) * 0.8 + Math.sin(time * 11) * 0.3;
                }
            });
            
            // Cinematic rail movement
            if (keys.a) playerAngle -= 1.0 * delta;
            if (keys.d) playerAngle += 1.0 * delta;
            
            playerAngle = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, playerAngle));
            
            const baseX = Math.sin(playerAngle) * 6;
            const baseZ = Math.cos(playerAngle) * 6;

            // Subtle camera movement on top of rail position
            camera.position.x = baseX + Math.sin(time * 0.1) * 0.3;
            camera.position.y = 3 + Math.sin(time * 0.15) * 0.1;
            camera.position.z = baseZ;
            camera.lookAt(0, 1, 0);
            
            renderer.render(scene, camera);
        }
        
        // Dialogue System
        function startDialogue(npcId) {
            const npc = npcs.find(n => n.userData.id === npcId);
            if (!npc) return;
            
            selectedNPC = npc;
            npc.userData.talking = true;
            
            // Update NPC status
            updateNPCStatus();
            
            // Chapter-aware dialogue
            const isCh2 = gameState.chapter === 2;
            const tree = isCh2 && npcData[npcId].chapter2
                ? npcData[npcId].chapter2
                : npcData[npcId].dialogueTree;
            
            const startNode = isCh2 ? 'intro_ch2' : 'intro';
            const node = tree[startNode] || tree.intro || Object.values(tree)[0];
            
            showDialogue(npcId, node);
            
            // Mark as talked to
            if (isCh2) {
                gameState.talkedToCh2[npcId] = true;
            } else {
                gameState.talkedTo[npcId] = true;
            }
        }
        
        let typeWriterInterval;

        function showDialogue(npcId, node) {
            const dialogueBox = document.getElementById('dialogue-box');
            const speakerName = document.getElementById('speaker-name');
            const dialogueText = document.getElementById('dialogue-text');
            const choicesDiv = document.getElementById('choices');
            
            speakerName.textContent = npcData[npcId].name;
            dialogueText.textContent = '';
            choicesDiv.innerHTML = '';
            
            dialogueBox.classList.add('visible');
            
            if (typeWriterInterval) clearInterval(typeWriterInterval);
            
            let charIndex = 0;
            const fullText = node.text;
            
            let skipHint = document.getElementById('skip-hint');
            if (!skipHint) {
                skipHint = document.createElement('div');
                skipHint.style.fontSize = '12px';
                skipHint.style.color = '#8a847a';
                skipHint.style.marginTop = '10px';
                skipHint.style.textAlign = 'right';
                skipHint.textContent = 'Click to skip';
                skipHint.id = 'skip-hint';
                dialogueBox.appendChild(skipHint);
            }
            skipHint.style.display = 'block';
            
            const showChoices = () => {
                if (node.choices) {
                    node.choices.forEach((choice, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.textContent = choice.text;
                        
                        btn.style.opacity = '0';
                        btn.style.transform = 'translateY(10px)';
                        btn.style.transition = `all 0.3s ease ${idx * 0.1}s`;
                        
                        const canChoose = !choice.requires || gameState.inventory.includes(choice.requires);
                        
                        if (canChoose) {
                            btn.onclick = (e) => {
                                e.stopPropagation();
                                handleChoice(npcId, choice);
                            };
                        } else {
                            btn.style.opacity = '0.5';
                            btn.textContent += ' (item required)';
                            btn.style.cursor = 'not-allowed';
                        }
                        
                        choicesDiv.appendChild(btn);
                        
                        setTimeout(() => {
                            btn.style.opacity = '1';
                            btn.style.transform = 'translateY(0)';
                        }, 50);
                    });
                }
            };
            
            const finishTyping = () => {
                clearInterval(typeWriterInterval);
                dialogueText.textContent = fullText;
                skipHint.style.display = 'none';
                showChoices();
                dialogueBox.onclick = null;
            };
            
            dialogueBox.onclick = finishTyping;
            
            typeWriterInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    dialogueText.textContent += fullText.charAt(charIndex);
                    charIndex++;
                } else {
                    finishTyping();
                }
            }, 30);
            
            // Apply relationship changes
            if (node.relation) {
                gameState.relationships[npcId] = Math.max(0, Math.min(100, gameState.relationships[npcId] + node.relation));
                updateNPCStatus();
            }
            
            // Apply effects
            if (node.effect) {
                applyEffect(node.effect);
            }
        }
        
        function handleChoice(npcId, choice) {
            if (choice.next === null) {
                endDialogue();
                return;
            }
            
            const tree = gameState.chapter === 2 && npcData[npcId].chapter2
                ? npcData[npcId].chapter2
                : npcData[npcId].dialogueTree;
            
            if (tree[choice.next]) {
                showDialogue(npcId, tree[choice.next]);
            } else if (npcData[npcId].dialogueTree[choice.next]) {
                showDialogue(npcId, npcData[npcId].dialogueTree[choice.next]);
            }
        }
        
        function endDialogue() {
            const dialogueBox = document.getElementById('dialogue-box');
            dialogueBox.classList.remove('visible');
            
            if (selectedNPC) {
                selectedNPC.userData.talking = false;
                selectedNPC.userData.lastTalkTime = clock.getElapsedTime();
            }
            
            selectedNPC = null;
        }
        
        function applyEffect(effect) {
            if (effect.clue) {
                gameState.cluesFound++;
                    showNotification(`New clue: ${effect.clue}`);
            }
            
            if (effect.addItem) {
                if (!gameState.inventory.includes(effect.addItem)) {
                    gameState.inventory.push(effect.addItem);
                    updateInventory();
                    showNotification(`Obtained: ${effect.addItem}`);
                }
            }
            
            if (effect.vision) {
                    showNotification(`Vision: ${effect.vision}`);
                triggerVision();
            }
            
            if (effect.quest) {
                    showNotification(`New quest: ${effect.quest}`);
            }
            
            if (effect.unlock === 'basement') {
                showNotification('Basement access unlocked!');
            }
            
            if (effect.trigger === 'go_to_basement') {
                showEnding();
            }
            
            if (effect.trigger === 'ending_destroy') {
                triggerEnding('destroy');
            }
            if (effect.trigger === 'ending_seal') {
                triggerEnding('seal');
            }
            if (effect.trigger === 'ending_power') {
                triggerEnding('power');
            }
            
            autoSave();
        }
        
        function updateInventory() {
            const inventoryDiv = document.getElementById('inventory');
            inventoryDiv.innerHTML = '';
            
            const icons = {
                'key': '🔑',
                'basement map': '📜',
                'basement code': '🔢',
                'opening date': '📅',
                "founder's photo": '📷',
                'protection amulet': '🔮',
                'door vision': '👁',
                'collection = freedom': '💎',
                "Elena's compass": '🧭',
                "Marco's Key": '🗝️',
                'silver bell': '🔔',
                'artifact knowledge': '📖'
            };
            
            gameState.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inventory-item';
                div.textContent = icons[item] || '📦';
                div.title = item;
                inventoryDiv.appendChild(div);
            });
        }
        
        function updateNPCStatus() {
            const statusDiv = document.getElementById('npc-status');
            statusDiv.innerHTML = '';
            
            npcs.forEach(npc => {
                const relation = gameState.relationships[npc.userData.id];
                const relationText = relation > 70 ? 'Friendly' : relation > 40 ? 'Neutral' : 'Wary';
                
                const card = document.createElement('div');
                card.className = 'npc-card';
                card.innerHTML = `
                    <div class="npc-card-name">${npc.userData.name}</div>
                    <div class="npc-card-relation">${relationText}</div>
                    <div class="relation-bar">
                        <div class="relation-fill" style="width: ${relation}%"></div>
                    </div>
                `;
                statusDiv.appendChild(card);
                
                setTimeout(() => card.classList.add('visible'), 100);
            });
        }
        
        function showNotification(text) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notification-text');
            
            notificationText.textContent = text;
            notification.classList.add('visible');
            
            setTimeout(() => {
                notification.classList.remove('visible');
            }, 3000);
        }
        
        function showFinalChoice() {
            const hasCompass = gameState.inventory.includes("Elena's compass");
            const hasKeyM = gameState.inventory.includes("Marco's Key");
            const hasBell = gameState.inventory.includes('silver bell');
            const hasAllItems = hasCompass && hasKeyM && hasBell;
            
            const talkedCh2 = gameState.talkedToCh2.elena && gameState.talkedToCh2.marco && gameState.talkedToCh2.nina;
            
            if (!talkedCh2) {
                showNotification('The sphere does not react. You need to learn more about it from those who were here.');
                return;
            }
            
            const sphereChoice = document.getElementById('dialogue-box');
            
            if (!hasAllItems) {
                sphereChoice.innerHTML = `
                    <div class="speaker-name">✦ Heart of the Collection ✦</div>
                    <div class="dialogue-text">
                        Before you pulses a golden sphere. It radiates powerful energy, but its protection is too strong.
                        <br><br>
                        <em style="color:#8a847a">You need to gather three artifacts to access the sphere's power:</em>
                        <br>
                        ${hasCompass ? '✅' : '❌'} Elena's Compass — to see the path through illusions
                        <br>
                        ${hasKeyM ? '✅' : '❌'} Marco's Key — to unlock the collection's locks
                        <br>
                        ${hasBell ? '✅' : '❌'} Nina's Silver Bell — to calm the spirits
                    </div>
                    <div class="choices">
                        <button class="choice-btn" onclick="endDialogue()">Continue searching</button>
                    </div>
                `;
                sphereChoice.classList.add('visible');
                return;
            }
            
            sphereChoice.innerHTML = `
                <div class="speaker-name">✦ Heart of the Collection ✦</div>
                <div class="dialogue-text">
                    Three artifacts glow in your hands. The sphere's defenses fall.
                    Before you lies the pulsing heart of the collection. Within it — the power of hundreds of souls,
                    Marcus's memories, and the key to unraveling this place's mystery.
                    <br><br>
                    <em style="color:#d4af37">The final choice. It will decide everything...</em>
                </div>
                <div class="choices">
                    <button class="choice-btn" onclick="window.finishGame('destroy')">💥 Shatter the sphere — free all souls</button>
                    <button class="choice-btn" onclick="window.finishGame('seal')">🔒 Seal the collection forever</button>
                    <button class="choice-btn" onclick="window.finishGame('power')">🔥 Accept the collection's power</button>
                    <button class="choice-btn" onclick="endDialogue()">Step back and think</button>
                </div>
            `;
            sphereChoice.classList.add('visible');
        }
        
        window.finishGame = function(type) {
            const box = document.getElementById('dialogue-box');
            box.classList.remove('visible');
            setTimeout(() => applyEffect({ trigger: 'ending_' + type }), 300);
        };
        
        function createChapter2Objects() {
            // Golden sphere - the heart of the collection
            const sphereGroup = new THREE.Group();
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                emissive: 0xff6600,
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), sphereMat);
            sphereGroup.add(sphere);
            
            // Glow aura
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = 128;
            glowCanvas.height = 128;
            const gCtx = glowCanvas.getContext('2d');
            const grad = gCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 200, 50, 0.3)');
            grad.addColorStop(0.5, 'rgba(255, 100, 0, 0.1)');
            grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            gCtx.fillStyle = grad;
            gCtx.fillRect(0, 0, 128, 128);
            
            const glowTex = new THREE.CanvasTexture(glowCanvas);
            const glowSprite = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending })
            );
            glowSprite.scale.set(2, 2, 1);
            sphereGroup.add(glowSprite);
            
            sphereGroup.position.set(0, 0.8, -1.5);
            sphereGroup.userData = { id: 'golden_sphere', name: 'Heart of the Collection' };
            scene.add(sphereGroup);
            
            showNotification('You feel the presence of something powerful in the center of the basement...');
        }
        
        function transitionToChapter2() {
            gameState.chapter = 2;
            autoSave();
            
            // Fade out effect
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;opacity:0;transition:opacity 1.5s;pointer-events:none;';
            document.body.appendChild(overlay);
            setTimeout(() => overlay.style.opacity = '1', 100);
            
            setTimeout(() => {
                // Change scene atmosphere
                scene.background.setHex(0x050308);
                scene.fog.color.setHex(0x050308);
                scene.fog.density = 0.08;
                
                // Dim all lights
                scene.children.forEach(c => {
                    if (c.isLight) {
                        if (c.intensity > 1) c.intensity *= 0.5;
                        if (c.color) {
                            const hex = c.color.getHex();
                            c.color.setHex(hex); // keep same hue but dimmer
                        }
                    }
                });
                
                // Eerie purple ambient
                const ambient = new THREE.AmbientLight(0x1a0033, 0.4);
                scene.add(ambient);
                
                // Show chapter title
                const chTitle = document.getElementById('chapter-title');
                const chIndicator = document.getElementById('chapter-indicator');
                if (chTitle) {
                    chTitle.textContent = '— Chapter 2: Marcus\'s Basement —';
                    chTitle.classList.add('visible');
                }
                if (chIndicator) {
                    chIndicator.textContent = 'Chapter 2: Marcus\'s Basement';
                }
                
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.remove();
                        if (chTitle) chTitle.classList.remove('visible');
                        
                        // Show notification
                        showNotification('Marcus\'s Basement. Be careful...');
                        
                        // Update hint
                        const hint = document.getElementById('click-hint');
                        if (hint) {
                            hint.textContent = 'Talk to the characters in the basement';
                            hint.classList.add('visible');
                            setTimeout(() => hint.classList.remove('visible'), 8000);
                        }
                    }, 1500);
                }, 2500);
            }, 1500);
            
            // Add chapter 2 objects after transition
            setTimeout(() => createChapter2Objects(), 4000);
        }
        
        function triggerEnding(endingType) {
            gameState.ending = endingType;
            
            // Disable interaction
            npcs.forEach(npc => { npc.userData.lookAtPlayer = false; });
            
            let title, text, btnText;
            
            if (endingType === 'destroy') {
                title = '✧ Liberation ✧';
                text = `You shatter the golden sphere. A wave of light rushes through the basement. 
The collection crumbles to dust. The souls imprisoned within gain their freedom. 
Marco disappears with a smile. Sergey regains consciousness. Nina cries — but for the first time in a long while — from relief.
The cafe has changed forever. But you feel: you made the right choice.`;
                btnText = 'End story';
            } else if (endingType === 'seal') {
                title = '🔒 Seal 🔒';
                text = `You seal the collection, using the knowledge gained from Elena and Marco. 
The sphere dims but does not shatter — it falls into slumber. 
The collection remains here, beneath the cafe, but no longer threatens anyone. 
Nina finally finds peace. Marco stays as the guardian. And you walk away into the dawn. 
The cafe continues to work — but now it is simply a cafe.`;
                btnText = 'End story';
            } else if (endingType === 'power') {
                title = '🔥 Power 🔥';
                text = `You accept the gift of the collection. 
The sphere flows into you — you feel incredible power. 
The memories of hundreds of souls flash before your eyes. 
Marco recoils in horror. Nina screams after you. Elena vanishes. 
You leave the cafe a different person. 
The collection is now a part of you. But what will you do with this power?`;
                btnText = 'Start over';
            } else {
                title = '✧ Fate of the Cafe ✧';
                text = `You make your decision — not under pressure, not from fear, but from the call of your heart.
The collection feels this. It reveals Marcus's secret: he did not disappear, he became part of the collection — its guardian.
Do you take his place? Or do you leave, leaving everything as it is?
The cafe continues to live. The mystery remains. And perhaps, someday, a new seeker will come here...`;
                btnText = 'Start over';
            }
            
            const dialogueBox = document.getElementById('dialogue-box');
            dialogueBox.innerHTML = `
                <div class="speaker-name">${title}</div>
                <div class="dialogue-text">
                    ${text}
                    <br><br>
                    <em style="color:#8a847a">Relationships: Elena ${gameState.relationships.elena} · Marco ${gameState.relationships.marco} · Nina ${gameState.relationships.nina}</em>
                    <br>
                    <em style="color:#8a847a">Clues found: ${gameState.cluesFound}</em>
                </div>
                <div class="choices">
                    <button class="choice-btn" onclick="location.reload()">${btnText}</button>
                </div>
            `;
            dialogueBox.classList.add('visible');
        }
        
        function showEnding() {
            if (gameState.chapter === 1) {
                // Check requirements for basement access
                const talkedToAll = gameState.talkedTo.elena && gameState.talkedTo.marco && gameState.talkedTo.nina;
                const hasAmulet = gameState.inventory.includes('protection amulet');
                const hasKey = gameState.inventory.includes('key');
                
                if (!talkedToAll) {
                    showNotification('You need to talk to all the cafe visitors before going down to the basement.');
                    return;
                }
                if (!hasAmulet) {
                    showNotification('Better not go into the basement without Nina\'s protection. Get the amulet.');
                    return;
                }
                if (!hasKey) {
                    showNotification('The basement door is locked. You need the key.');
                    return;
                }
                transitionToChapter2();
            }
        }

        function createMobileNPCList() {
            const listDiv = document.getElementById('mobile-npc-list');
            if (!listDiv) return;
            listDiv.innerHTML = '';
            
            Object.keys(npcData).forEach((key, i) => {
                const item = document.createElement('div');
                item.className = 'mobile-npc-item';
                item.textContent = npcData[key].name;
                item.style.transitionDelay = (i * 0.1) + 's';
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    startDialogue(key);
                });
                item.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    startDialogue(key);
                });
                listDiv.appendChild(item);
            });
            
            setTimeout(() => listDiv.classList.add('visible'), 500);
        }
        
        function startGame() {
            // Clear any existing save for a fresh start
            localStorage.removeItem(SAVE_KEY);
            gameStarted = true;
            document.getElementById('intro').classList.add('hidden');
            updateNPCStatus();
            initAudio();
            createMobileNPCList();
            
            document.getElementById('chapter-indicator').textContent = 'Chapter 1: Night Cafe';
            document.getElementById('chapter-indicator').classList.add('visible');
            
            const hintElem = document.getElementById('click-hint');
            if ('ontouchstart' in window) {
                hintElem.textContent = 'Tap a name on the left to talk';
                setTimeout(() => {
                    hintElem.classList.add('visible');
                    setTimeout(() => hintElem.classList.remove('visible'), 5000);
                }, 1000);
            } else {
                hintElem.textContent = 'Use A and D keys to look around. Click on a character or their name to talk.';
            }
            
            // Show hint after a delay
            setTimeout(() => {
                hintElem.classList.add('visible');
            }, 2000);
            
            setTimeout(() => {
                hintElem.classList.remove('visible');
            }, 10000);
            
            saveGame();
        }
        
        // Initialize on load
        window.onload = function() {
            init();
            if (hasSave()) {
                const btnGroup = document.getElementById('intro-buttons');
                btnGroup.innerHTML = `
                    <button class="continue-btn" onclick="continueGame()">CONTINUE</button>
                    <button class="reset-btn" onclick="resetGame()">RESET</button>
                `;
            }
        };
    </script>
</body>
</html>
