<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тайна Ночного Кафе</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background: #0a0a0a;
            color: #e8e4dc;
            overflow: hidden;
            height: 100vh;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 3px;
        }
        
        .inventory {
            display: flex;
            gap: 15px;
        }
        
        .inventory-item {
            width: 50px;
            height: 50px;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(20, 15, 10, 0.8);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .inventory-item:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            background: linear-gradient(135deg, rgba(15, 12, 8, 0.95), rgba(30, 22, 15, 0.9));
            border: 1px solid #d4af37;
            border-radius: 15px;
            padding: 25px 35px;
            pointer-events: auto;
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            transition: all 0.4s ease-out;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(212, 175, 55, 0.1);
        }
        
        .dialogue-box.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        .speaker-name {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .speaker-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background: linear-gradient(135deg, #2a2015, #1a1510);
        }
        
        .dialogue-text {
            font-size: 17px;
            line-height: 1.7;
            color: #c8c4bc;
            margin-bottom: 20px;
            min-height: 60px;
        }
        
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .choice-btn {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #e8e4dc;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s;
            font-family: 'Source Sans Pro', sans-serif;
        }
        
        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.15));
            border-color: #d4af37;
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        
        .npc-status {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
        }
        
        .npc-card {
            background: rgba(15, 12, 8, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 15px;
            width: 200px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease-out;
        }
        
        .npc-card.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .npc-card-name {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: #d4af37;
            margin-bottom: 8px;
        }
        
        .npc-card-relation {
            font-size: 13px;
            color: #8a847a;
        }
        
        .relation-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .relation-fill {
            height: 100%;
            background: linear-gradient(90deg, #8b4513, #d4af37);
            border-radius: 2px;
            transition: width 0.5s ease-out;
        }
        
        .intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1a1510 0%, #0a0806 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }
        
        .intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .intro-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            color: #d4af37;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            letter-spacing: 8px;
        }
        
        .intro-subtitle {
            font-size: 18px;
            color: #8a847a;
            letter-spacing: 4px;
            margin-bottom: 50px;
        }
        
        .start-btn {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #d4af37;
            background: transparent;
            border: 2px solid #d4af37;
            padding: 15px 50px;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.4s;
        }
        
        .start-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            transform: scale(1.05);
        }
        
        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(30, 22, 15, 0.95));
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 30px 50px;
            text-align: center;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s;
        }
        
        .notification.visible {
            opacity: 1;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); }
        }
        
        .notification-text {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #d4af37;
        }
        
        .hint-text {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #5a554d;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #d4af37;
            font-size: 18px;
            letter-spacing: 3px;
        }

        .click-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #6a655d;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .click-hint.visible {
            opacity: 1;
        }

        .chapter-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4af37;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.6), 0 0 80px rgba(100, 0, 150, 0.3);
            letter-spacing: 6px;
            pointer-events: none;
            z-index: 100;
            opacity: 0;
            transition: opacity 2s ease-out;
            text-align: center;
        }

        .chapter-title.visible {
            opacity: 1;
        }

        .chapter-indicator {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-size: 14px;
            color: rgba(212, 175, 55, 0.4);
            letter-spacing: 4px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 1s;
        }

        .chapter-indicator.visible {
            opacity: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 30%, rgba(20, 10, 0, 0.7) 100%);
            z-index: 10;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            z-index: 11;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="canvas-container"></div>
        <div class="vignette"></div>
        <div class="scanlines"></div>
        
        <div class="intro-screen" id="intro">
            <div class="intro-title">ТАЙНА</div>
            <div class="intro-subtitle">НОЧНОГО КАФЕ</div>
            <button class="start-btn" onclick="startGame()">НАЧАТЬ</button>
        </div>
        
        <div id="ui-overlay">
            <div class="top-bar">
                <div class="game-title">ТАЙНА НОЧНОГО КАФЕ</div>
                <div class="inventory" id="inventory"></div>
            </div>
            
            <div class="npc-status" id="npc-status"></div>
            
            <div class="dialogue-box" id="dialogue-box">
                <div class="speaker-name">
                    <div class="speaker-avatar"></div>
                    <span id="speaker-name">Имя</span>
                </div>
                <div class="dialogue-text" id="dialogue-text">Текст диалога...</div>
                <div class="choices" id="choices"></div>
            </div>
            
            <div class="click-hint" id="click-hint">Кликните на персонажа для разговора</div>
        </div>
        
        <div class="notification" id="notification">
            <div class="notification-text" id="notification-text"></div>
        </div>

        <div class="chapter-title" id="chapter-title"></div>
        <div class="chapter-indicator" id="chapter-indicator">Глава 1: Ночное Кафе</div>
        
        <div class="loading" id="loading">ЗАГРУЗКА...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script>
        // Game State
        let scene, camera, renderer, clock;
        let npcs = [];
        let selectedNPC = null;
        let gameStarted = false;
        
        const gameState = {
            relationships: {},
            inventory: [],
            cluesFound: 0,
            talkedTo: {},
            talkedToCh2: {},
            day: 1,
            chapter: 1,
            ending: null,
            sergeyRescued: false,
            basementSecretFound: false
        };
        
        // Input and Audio
        let playerAngle = 0;
        const keys = { a: false, d: false };

        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key.toLowerCase() === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if(e.key.toLowerCase() === 'd' || e.key === 'ArrowRight') keys.d = false;
        });

        let audioContext;
        let masterGain;
        window.audioOscillators = [];
        window.isJazz = false;
        
        function initAudio() {
            if (audioContext) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.gain.value = 0.2;
                masterGain.connect(audioContext.destination);
                
                // Warm Cmaj7 chord
                const freqs = [130.81, 164.81, 196.00, 246.94]; 
                freqs.forEach(f => {
                    const osc = audioContext.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.value = f;
                    const panner = audioContext.createStereoPanner ? audioContext.createStereoPanner() : audioContext.createGain();
                    if (panner.pan) panner.pan.value = (Math.random() - 0.5) * 0.5;
                    
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 400 + Math.random()*200;
                    
                    osc.connect(filter);
                    filter.connect(panner);
                    panner.connect(masterGain);
                    osc.start();
                    window.audioOscillators.push(osc);
                });

                // Fire crackle noise
                const bufferSize = audioContext.sampleRate * 2;
                const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() > 0.995 ? Math.random() * 2 - 1 : 0;
                }
                const noise = audioContext.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;
                
                const noiseFilter = audioContext.createBiquadFilter();
                noiseFilter.type = 'lowpass';
                noiseFilter.frequency.value = 1000;
                
                noise.connect(noiseFilter);
                noiseFilter.connect(masterGain);
                noise.start();
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function toggleMusic() {
            if (!audioContext) return;
            window.isJazz = !window.isJazz;
            showNotification(window.isJazz ? "Граммофон: Режим повышенной тональности" : "Граммофон: Уютный режим");
            
            if (window.isJazz) {
                window.audioOscillators.forEach(osc => { osc.frequency.value *= 1.25; });
            } else {
                window.audioOscillators.forEach(osc => { osc.frequency.value /= 1.25; });
            }
        }

        // NPC Data
        const npcData = {
            elena: {
                name: "Элена",
                color: 0xd4a574,
                position: { x: -2, y: 0, z: 1 },
                personality: "загадочная",
                dialogueTree: {
                    intro: {
                        text: "Одна посетительница в углу поднимает взгляд от книги. Её глаза цвета янтаря изучают вас с любопытством.",
                        choices: [
                            { text: "Подойти и поздороваться", next: "greeting" },
                            { text: "Притвориться, что не заметил", next: "ignore" }
                        ]
                    },
                    greeting: {
                        text: "Вы присели за соседний столик. 'Вы здесь часто бываете?' — спрашивает она, закрывая книгу. — 'Я Элена. Странно видеть новые лица в такое время...'",
                        choices: [
                            { text: "'А почему такое время считается странным?'", next: "curious", relation: 10 },
                            { text: "'Просто зашёл выпить кофе'", next: "dismissive", relation: -5 }
                        ]
                    },
                    ignore: {
                        text: "Вы сели за барную стойку. Через несколько минут Элена сама подходит к вам.",
                        choices: [
                            { text: "Слушать", next: "surprise_approach" }
                        ]
                    },
                    surprise_approach: {
                        text: "'Вы избегаете людей?' — её голос мягкий, но в нём слышится вызов. — 'Я заметила. Но в этом кафе никто не приходит просто так.'",
                        choices: [
                            { text: "'Вы правы. Я ищу кое-что'", next: "reveal", relation: 15 },
                            { text: "'Просто хотел спокойствия'", next: "dismissive2", relation: -10 }
                        ]
                    },
                    curious: {
                        text: "'Это кафе... особенное', — она понижает голос. — 'По ночам здесь встречаются люди, которые ищут что-то. Что-то конкретное.'",
                        choices: [
                            { text: "'Что именно они ищут?'", next: "secret", relation: 20 },
                            { text: "Сменить тему", next: "change_topic" }
                        ]
                    },
                    reveal: {
                        text: "Элена кивает, как будто ожидала этого ответа. 'Я так и думала. У меня есть информация, но...' она смотрит на ваши руки. 'Ты принес что-нибудь ценное?'",
                        effect: { clue: "старинный ключ" },
                        choices: [
                            { text: "Показать найденный ключ", next: "key_found", requires: "ключ" },
                            { text: "'У меня ничего нет'", next: "no_item", relation: -5 }
                        ]
                    },
                    key_found: {
                        text: "Её глаза расширяются. 'Это... ключ от подвала! Там хранится то, что ищут многие. Но туда ведёт только один путь...' она рисует на салфетке схему.",
                        effect: { addItem: "схема подвала", clue: "схема" },
                        choices: [
                            { text: "Спросить подробности", next: "basement_info", relation: 25 }
                        ]
                    },
                    basement_info: {
                        text: "'Подвал находится за барной стойкой. Чтобы попасть туда, нужно знать код. Ищи на стене картину с совой...'",
                        choices: [
                            { text: "Запомнить и уйти", next: "end_conversation" }
                        ]
                    },
                    secret: {
                        text: "Она наклоняется ближе. 'Здесь ходят слухи об одном человеке... основателе кафе. Говорят, он спрятал что-то ценное перед смертью.'",
                        choices: [
                            { text: "Узнать больше", next: "founder_story", relation: 15 }
                        ]
                    },
                    founder_story: {
                        text: "'Его звали Маркус. Он был коллекционером. Его коллекция... она где-то здесь, в здании. Но где — никто не знает.'",
                        choices: [
                            { text: "Как вы узнали об этом?", next: "how_know", relation: 10 },
                            { text: "Спасибо за информацию", next: "end_conversation" }
                        ]
                    },
                    how_know: {
                        text: "'Я... работала здесь раньше. До того, как он исчез.' В её глазах мелькает что-то тёмное. 'Многое знаю. Но не всё расскажу даром.'",
                        choices: [
                            { text: "Что вам нужно?", next: "her_deal", relation: 5 }
                        ]
                    },
                    her_deal: {
                        text: "'Помоги мне найти одну вещь. Она была в коллекции Маркуса — золотая брошь с изображением луны. Найдёшь — расскажу всё остальное.'",
                        effect: { quest: "найти брошь" },
                        choices: [
                            { text: "Согласиться", next: "quest_accepted", relation: 20 },
                            { text: "Отказаться", next: "quest_refused", relation: -10 }
                        ]
                    },
                    quest_accepted: {
                        text: "'Хорошо. Начни с поисков в задней комнате. Там много коробок с вещами Маркуса.'",
                        choices: [
                            { text: "Отправиться на поиски", next: "end_conversation" }
                        ]
                    },
                    quest_refused: {
                        text: "Элена холодно улыбается. 'Тогда ты многого не узнаешь. Но выбор за тобой.'",
                        choices: [
                            { text: "Уйти", next: "end_conversation" }
                        ]
                    },
                    end_conversation: {
                        text: "Элена возвращается к своей книге. Вы чувствуете, что узнали что-то важное.",
                        choices: [
                            { text: "Отойти", next: null }
                        ]
                    },
                    change_topic: {
                        text: "'Как хочешь', — она пожимает плечами и отводит взгляд.",
                        choices: [
                            { text: "Вернуться к теме", next: "curious" }
                        ]
                    },
                    dismissive: {
                        text: "'Туристы здесь — редкость', — сухо замечает она. 'Особенно в такое время.'",
                        choices: [
                            { text: "Присесть рядом", next: "curious" }
                        ]
                    },
                    dismissive2: {
                        text: "Она понимающе кивает, но в глазах мелькает разочарование.",
                        choices: [
                            { text: "Всё же рассказать правду", next: "reveal" }
                        ]
                    },
                    no_item: {
                        text: "'Жаль', — она качает головой. 'Приходи, когда найдёшь что-то стоящее.'",
                        choices: [
                            { text: "Отойти", next: "end_conversation" }
                        ]
                    }
                },
                chapter2: {
                    intro_ch2: {
                        text: "Элена стоит у стеллажа с книгами в подвале. 'Ты всё-таки спустился. Я знала, что ты найдёшь путь.'",
                        choices: [
                            { text: "Что здесь происходит?", next: "ch2_explain", relation: 10 },
                            { text: "Кто ты на самом деле?", next: "ch2_who" }
                        ]
                    },
                    ch2_explain: {

        // Initialize Three.js scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a120c);
            scene.fog = new THREE.Fog(0x1a120c, 5, 20);
            
            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3, 6);
            camera.lookAt(0, 1, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 2.5;
            container.appendChild(renderer.domElement);
            
            // Clock
            clock = new THREE.Clock();
            
            // Lighting
            setupLighting();
            
            // Room
            createRoom();
            
            // NPCs
            createNPCs();
            
            // Interactive items
            createInteractables();
            
            // Post-processing feel with particles
            createAmbientParticles();
            
            // Raycaster for interaction
            window.raycaster = new THREE.Raycaster();
            window.mouse = new THREE.Vector2();
            
            // Events
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseClick);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            // Start animation
            animate();
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }
        
        function setupLighting() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x3a3020, 0.8);
            scene.add(ambient);
            
            // Hemisphere light for general fill
            const hemiLight = new THREE.HemisphereLight(0x5a4a35, 0x3a2a20, 0.8);
            scene.add(hemiLight);
            
            // Main warm light (chandelier)
            const mainLight = new THREE.SpotLight(0xffaa55, 5.0, 15, Math.PI / 3, 0.5, 1);
            mainLight.position.set(0, 5, 0);
            mainLight.castShadow = true;
            
            // Hearth / Fireplace light
            const hearthLight = new THREE.PointLight(0xff6600, 3.0, 10);
            hearthLight.position.set(-5, 1, -4);
            hearthLight.userData.isHearth = true;
            scene.add(hearthLight);
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            scene.add(mainLight);
            
            // Warm accent lights
            const accentPositions = [
                { x: -4, z: 2, color: 0xe8c884 },
                { x: 4, z: 2, color: 0xe8c884 },
                { x: 0, z: -3, color: 0xd4af37 },
                { x: -3, z: -2, color: 0xe8c884 },
                { x: 3, z: -2, color: 0xe8c884 }
            ];
            
            accentPositions.forEach(pos => {
                const light = new THREE.PointLight(pos.color, 2.5, 12);
                light.position.set(pos.x, 2.5, pos.z);
                scene.add(light);
            });
            
            // Candle lights
            for (let i = 0; i < 5; i++) {
                const candleLight = new THREE.PointLight(0xffaa55, 1.5, 5);
                candleLight.position.set(
                    Math.sin(i * 1.2) * 3,
                    0.8,
                    Math.cos(i * 1.2) * 2
                );
                scene.add(candleLight);
            }
            
            // Extra fill light
            const fillLight = new THREE.PointLight(0xc8b898, 2.0, 15);
            fillLight.position.set(0, 3, 0);
            scene.add(fillLight);
        }
        
        function createRoom() {
            // Floor with plank texture
            createFloorWithPlanks();
            
            // Cozy Rug
            const rugGeo = new THREE.PlaneGeometry(7, 5);
            const rugMat = new THREE.MeshStandardMaterial({ color: 0x5a2015, roughness: 1.0 });
            const rug = new THREE.Mesh(rugGeo, rugMat);
            rug.rotation.x = -Math.PI / 2;
            rug.position.set(0, 0.01, 0);
            scene.add(rug);
            
            // Window on the left wall
            const windowGeo = new THREE.PlaneGeometry(4, 3);
            const windowMat = new THREE.MeshStandardMaterial({ 
                color: 0x050a15,

                opacity: 0.5
            });
            const windowMesh = new THREE.Mesh(windowGeo, windowMat);

            windowMesh.rotation.y = Math.PI / 2;

            // Rain particles outside window

                rainPos[i*3] = -6.5 + Math.random();
                rainPos[i*3+1] = Math.random() * 6;
                rainPos[i*3+2] = (Math.random() - 0.5) * 5;
            }
            rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
            const rainMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.05, transparent: true, opacity: 0.6 });
            const rain = new THREE.Points(rainGeo, rainMat);
            rain.userData.isRain = true;
            scene.add(rain);

            // Lightning light

        // ===== Realism improvements =====
        function createCanvasTexture(width, height, drawFunc) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFunc(ctx, width, height);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createFloorWithPlanks() {
            // Remove old floor if exists (from previous implementations)
            const oldFloors = scene.children.filter(c => 
                c.isMesh && c.material && c.material.color && 
                c.material.color.getHex() === 0x2a1f15 && 
                c.geometry.type === 'PlaneGeometry' && 
                Math.abs(c.position.y) < 0.1
            );
            oldFloors.forEach(f => scene.remove(f));

            const plankTex = createCanvasTexture(512, 512, (ctx, w, h) => {
                ctx.fillStyle = '#2a1f15';
                ctx.fillRect(0, 0, w, h);
                // Plank lines
                ctx.strokeStyle = '#1a0f08';
                ctx.lineWidth = 2;
                const plankH = h / 12;
                for (let y = 0; y < h; y += plankH) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                    // Random plank end joints
                    for (let x = 0; x < w; x += 60 + Math.random() * 80) {
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x, y + plankH);
                        ctx.stroke();
                    }
                }
                // Wood grain
                ctx.strokeStyle = 'rgba(60, 40, 20, 0.15)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 30; i++) {
                    const y = Math.random() * h;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    for (let x = 0; x < w; x += 20) {
                        ctx.lineTo(x, y + Math.sin(x * 0.05 + i) * 2);
                    }
                    ctx.stroke();
                }
            });
            plankTex.repeat.set(4, 4);

            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(24, 24),
                new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.8, metalness: 0.05 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function createHumanoid(skinColor, position, npcId) {
            const group = new THREE.Group();
            
            // Skin material with slight subsurface look
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: skinColor, 
                roughness: 0.6,
                metalness: 0.0,
                emissive: skinColor,
                emissiveIntensity: 0.02
            });
            
            // NPC-specific appearance
            const isElena = npcId === 'elena';
            const isMarco = npcId === 'marco';

        function collectItem(itemObj) {
            const itemName = itemObj.userData.name;
            if (!gameState.inventory.includes(itemName)) {
                gameState.inventory.push(itemName);

                showNotification(`Вы нашли предмет: ${itemName}`);

        function triggerVision() {
            // Screen flash effect
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'rgba(255, 255, 255, 0.9)';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '9999';
            flash.style.transition = 'opacity 2.0s ease-out';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 2000);
            }, 50);

            // Change lighting to eerie purple
            scene.children.forEach(c => {
                if (c.isLight && !c.userData.isLightning) {
                    if (c.intensity > 1) {
                        c.color.setHex(0x5500aa); 
                    }
                }
            });

            // Make the hidden door appear behind the bar
            const doorGeo = new THREE.PlaneGeometry(1.8, 3.5);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x220000, emissive: 0x550000, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.5 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 1.75, -4.9);
            door.userData = { id: 'secret_door', name: 'Спуск в подвал', isDoor: true };
            scene.add(door);
            
            showNotification("Мир изменился... Вы видите скрытое.");
        }

        function createAmbientParticles() {
            const particleCount = 100;
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 10;
                positions[i * 3 + 1] = Math.random() * 4;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 10;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xd4a574,
                size: 0.03,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending
            });
            
            const particles = new THREE.Points(geometry, material);
            particles.userData.isParticles = true;
            scene.add(particles);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onMouseMove(event) {
            window.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            window.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Check for hover
            window.raycaster.setFromCamera(window.mouse, camera);
            const intersects = window.raycaster.intersectObjects(scene.children, true);
            
            let hoveringNPC = false;
            intersects.forEach(intersect => {
                if (intersect.object.parent && intersect.object.parent.userData && intersect.object.parent.userData.id) {
                    hoveringNPC = true;
                }
            });
            
            renderer.domElement.style.cursor = hoveringNPC ? 'pointer' : 'default';
        }
        
        function onMouseClick(event) {
            if (!gameStarted) return;
            
            window.raycaster.setFromCamera(window.mouse, camera);
            const intersects = window.raycaster.intersectObjects(scene.children, true);
            
            let clickedObject = null;
            intersects.forEach(intersect => {
                let obj = intersect.object;
                if (obj.parent && obj.parent.userData && obj.parent.userData.id) {
                    clickedObject = obj.parent;
                } else if (obj.userData && obj.userData.id) {
                    clickedObject = obj;
                }
            });
            
            if (clickedObject && clickedObject.userData) {
                const u = clickedObject.userData;
                if (u.id === 'gramophone') {
                    toggleMusic();
                } else if (u.isItem) {
                    collectItem(clickedObject);
                } else if (u.isDoor) {
                    showEnding();
                } else if (u.id === 'golden_sphere') {
                    showFinalChoice();
                } else if (u.id) {
                    startDialogue(u.id);
                }
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            // Animate NPCs
            npcs.forEach((npc, index) => {
                // Breathing animation
                const breathScale = 1 + Math.sin(time * 2 + index) * 0.005;
                npc.scale.y = breathScale;
                
                // Slight movement
                npc.position.x = npc.userData.basePosition.x + Math.sin(time * 0.5 + index * 2) * 0.02;
                
                // Look at camera/player
                if (npc.userData.lookAtPlayer && !npc.userData.talking) {
                    const targetLook = new THREE.Vector3(camera.position.x, 1.5, camera.position.z);
                    npc.lookAt(targetLook);
                }
                
                // Idle head movement
                const head = npc.children[0];
                if (head) {
                    head.rotation.y = Math.sin(time * 0.3 + index) * 0.1;
                }
                
                // Blinking animation
                if (!npc.userData.blinkTimer) npc.userData.blinkTimer = 3 + Math.random() * 5;
                if (!npc.userData.isBlinking) {
                    npc.userData.blinkTimer -= delta;
                    if (npc.userData.blinkTimer <= 0) {
                        npc.userData.isBlinking = true;
                        npc.userData.blinkPhase = 0;
                    }
                }
                if (npc.userData.isBlinking) {
                    npc.userData.blinkPhase += delta * 10;
                    const t = npc.userData.blinkPhase;
                    let lidScaleY;
                    if (t < 0.1) {
                        lidScaleY = 0.8 - (0.8 / 0.1) * t;
                    } else if (t < 0.2) {
                        lidScaleY = 0;
                    } else if (t < 0.3) {
                        lidScaleY = (0.8 / 0.1) * (t - 0.2);
                    } else {
                        lidScaleY = 0.8;
                        npc.userData.isBlinking = false;
                        npc.userData.blinkTimer = 3 + Math.random() * 5;
                    }
                    npc.children.forEach(child => {
                        if (child.userData && child.userData.isEyelid) {
                            child.scale.y = lidScaleY;
                            if (lidScaleY < 0.15) child.scale.y = 0.01;
                        }
                    });
                }
            });
            
            // Animate dynamic elements
            scene.children.forEach(child => {
                if (child.userData && child.userData.isParticles) {
                    const positions = child.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 1] += Math.sin(time + positions[i]) * 0.001;
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                    child.rotation.y = time * 0.05;
                }
                
                if (child.userData && child.userData.isHearth) {
                    child.intensity = 2.5 + Math.random() * 1.0;
                }
                
                if (child.userData && child.userData.isRain) {
                    const positions = child.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i + 1] -= delta * 6;
                        if (positions[i + 1] < 0) positions[i + 1] = 6;
                    }
                    child.geometry.attributes.position.needsUpdate = true;
                }
                
                if (child.userData && child.userData.isLightning) {
                    if (Math.random() > 0.995) {
                        child.intensity = 5 + Math.random() * 15;
                    } else {
                        child.intensity = Math.max(0, child.intensity - delta * 50);
                    }
                }
                
                // Fireplace flame flicker
                if (child.userData && child.userData.isFire) {
                    const flicker = Math.sin(time * 5 + child.userData.phase) * 0.3 + 0.7;
                    child.scale.set(0.2 * flicker, 0.3 * flicker, 1);
                    child.position.y = child.userData.baseY + Math.sin(time * 6 + child.userData.phase) * 0.05;
                }
                
                // Candle flame flicker
                if (child.userData && child.userData.isFlame) {
                    const flicker = Math.sin(time * 8 + child.userData.phase) * 0.2 + 0.8;
                    child.scale.setScalar(flicker);
                    child.position.y = child.userData.baseY + Math.sin(time * 7 + child.userData.phase) * 0.02;
                }
                
                // Fireplace light flicker
                if (child.userData && child.userData.isFireLight) {
                    child.intensity = 1.5 + Math.sin(time * 6) * 0.8 + Math.sin(time * 11) * 0.3;
                }
            });
            
            // Cinematic rail movement
            if (keys.a) playerAngle -= 1.0 * delta;
            if (keys.d) playerAngle += 1.0 * delta;
            
            playerAngle = Math.max(-Math.PI/2.5, Math.min(Math.PI/2.5, playerAngle));
            
            const baseX = Math.sin(playerAngle) * 6;
            const baseZ = Math.cos(playerAngle) * 6;

            // Subtle camera movement on top of rail position
            camera.position.x = baseX + Math.sin(time * 0.1) * 0.3;
            camera.position.y = 3 + Math.sin(time * 0.15) * 0.1;
            camera.position.z = baseZ;
            camera.lookAt(0, 1, 0);
            
            renderer.render(scene, camera);
        }
        
        // Dialogue System
        function startDialogue(npcId) {
            const npc = npcs.find(n => n.userData.id === npcId);
            if (!npc) return;
            
            selectedNPC = npc;
            npc.userData.talking = true;
            
            // Update NPC status
            updateNPCStatus();
            
            // Chapter-aware dialogue
            const isCh2 = gameState.chapter === 2;
            const tree = isCh2 && npcData[npcId].chapter2
                ? npcData[npcId].chapter2
                : npcData[npcId].dialogueTree;
            
            const startNode = isCh2 ? 'intro_ch2' : 'intro';
            const node = tree[startNode] || tree.intro || Object.values(tree)[0];
            
            showDialogue(npcId, node);
            
            // Mark as talked to
            if (isCh2) {
                gameState.talkedToCh2[npcId] = true;
            } else {
                gameState.talkedTo[npcId] = true;
            }
        }
        
        let typeWriterInterval;

        function showDialogue(npcId, node) {
            const dialogueBox = document.getElementById('dialogue-box');
            const speakerName = document.getElementById('speaker-name');
            const dialogueText = document.getElementById('dialogue-text');
            const choicesDiv = document.getElementById('choices');
            
            speakerName.textContent = npcData[npcId].name;
            dialogueText.textContent = '';
            choicesDiv.innerHTML = '';
            
            dialogueBox.classList.add('visible');
            
            if (typeWriterInterval) clearInterval(typeWriterInterval);
            
            let charIndex = 0;
            const fullText = node.text;
            
            let skipHint = document.getElementById('skip-hint');
            if (!skipHint) {
                skipHint = document.createElement('div');
                skipHint.style.fontSize = '12px';
                skipHint.style.color = '#8a847a';
                skipHint.style.marginTop = '10px';
                skipHint.style.textAlign = 'right';
                skipHint.textContent = 'Кликните для пропуска';
                skipHint.id = 'skip-hint';
                dialogueBox.appendChild(skipHint);
            }
            skipHint.style.display = 'block';
            
            const showChoices = () => {
                if (node.choices) {
                    node.choices.forEach((choice, idx) => {
                        const btn = document.createElement('button');
                        btn.className = 'choice-btn';
                        btn.textContent = choice.text;
                        
                        btn.style.opacity = '0';
                        btn.style.transform = 'translateY(10px)';
                        btn.style.transition = `all 0.3s ease ${idx * 0.1}s`;
                        
                        const canChoose = !choice.requires || gameState.inventory.includes(choice.requires);
                        
                        if (canChoose) {
                            btn.onclick = (e) => {
                                e.stopPropagation();
                                handleChoice(npcId, choice);
                            };
                        } else {
                            btn.style.opacity = '0.5';
                            btn.textContent += ' (нужен предмет)';
                            btn.style.cursor = 'not-allowed';
                        }
                        
                        choicesDiv.appendChild(btn);
                        
                        setTimeout(() => {
                            btn.style.opacity = '1';
                            btn.style.transform = 'translateY(0)';
                        }, 50);
                    });
                }
            };
            
            const finishTyping = () => {
                clearInterval(typeWriterInterval);
                dialogueText.textContent = fullText;
                skipHint.style.display = 'none';
                showChoices();
                dialogueBox.onclick = null;
            };
            
            dialogueBox.onclick = finishTyping;
            
            typeWriterInterval = setInterval(() => {
                if (charIndex < fullText.length) {
                    dialogueText.textContent += fullText.charAt(charIndex);
                    charIndex++;
                } else {
                    finishTyping();
                }
            }, 30);
            
            // Apply relationship changes
            if (node.relation) {
                gameState.relationships[npcId] = Math.max(0, Math.min(100, gameState.relationships[npcId] + node.relation));
                updateNPCStatus();
            }
            
            // Apply effects
            if (node.effect) {
                applyEffect(node.effect);
            }
        }
        
        function handleChoice(npcId, choice) {
            if (choice.next === null) {
                endDialogue();
                return;
            }
            
            const tree = gameState.chapter === 2 && npcData[npcId].chapter2
                ? npcData[npcId].chapter2
                : npcData[npcId].dialogueTree;
            
            if (tree[choice.next]) {
                showDialogue(npcId, tree[choice.next]);
            } else if (npcData[npcId].dialogueTree[choice.next]) {
                showDialogue(npcId, npcData[npcId].dialogueTree[choice.next]);
            }
        }
        
        function endDialogue() {
            const dialogueBox = document.getElementById('dialogue-box');
            dialogueBox.classList.remove('visible');
            
            if (selectedNPC) {
                selectedNPC.userData.talking = false;
                selectedNPC.userData.lastTalkTime = clock.getElapsedTime();
            }
            
            selectedNPC = null;
        }
        
        function applyEffect(effect) {
            if (effect.clue) {
                gameState.cluesFound++;
                showNotification(`Новая улика: ${effect.clue}`);
            }
            
            if (effect.addItem) {
                if (!gameState.inventory.includes(effect.addItem)) {
                    gameState.inventory.push(effect.addItem);
                    updateInventory();
                    showNotification(`Получено: ${effect.addItem}`);
                }
            }
            
            if (effect.vision) {
                showNotification(`Видение: ${effect.vision}`);
                triggerVision();
            }
            
            if (effect.quest) {
                showNotification(`Новое задание: ${effect.quest}`);
            }
            
            if (effect.unlock === 'подвал') {
                showNotification('Открыт доступ к подвалу!');
            }
            
            if (effect.trigger === 'go_to_basement') {
                showEnding();
            }
            
            if (effect.trigger === 'ending_destroy') {
                triggerEnding('destroy');
            }
            if (effect.trigger === 'ending_seal') {
                triggerEnding('seal');
            }
            if (effect.trigger === 'ending_power') {
                triggerEnding('power');
            }
        }
        
        function updateInventory() {
            const inventoryDiv = document.getElementById('inventory');
            inventoryDiv.innerHTML = '';
            
            const icons = {
                'ключ': '🔑',
                'схема подвала': '📜',
                'код подвала': '🔢',
                'дата открытия': '📅',
                'фотография основателя': '📷',
                'амулет защиты': '🔮',
                'видение двери': '👁',
                'коллекция = свобода': '💎',
                'компас Элены': '🧭',
                'ключ Марко': '🗝️',
                'серебряный колокольчик': '🔔',
                'знание об артефакте': '📖'
            };
            
            gameState.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inventory-item';
                div.textContent = icons[item] || '📦';
                div.title = item;
                inventoryDiv.appendChild(div);
            });
        }
        
        function updateNPCStatus() {
            const statusDiv = document.getElementById('npc-status');
            statusDiv.innerHTML = '';
            
            npcs.forEach(npc => {
                const relation = gameState.relationships[npc.userData.id];
                const relationText = relation > 70 ? 'Дружелюбный' : relation > 40 ? 'Нейтральный' : 'Настороженный';
                
                const card = document.createElement('div');
                card.className = 'npc-card';
                card.innerHTML = `
                    <div class="npc-card-name">${npc.userData.name}</div>
                    <div class="npc-card-relation">${relationText}</div>
                    <div class="relation-bar">
                        <div class="relation-fill" style="width: ${relation}%"></div>
                    </div>
                `;
                statusDiv.appendChild(card);
                
                setTimeout(() => card.classList.add('visible'), 100);
            });
        }
        
        function showNotification(text) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notification-text');
            
            notificationText.textContent = text;
            notification.classList.add('visible');
            
            setTimeout(() => {
                notification.classList.remove('visible');
            }, 3000);
        }
        
        function showFinalChoice() {
            const hasCompass = gameState.inventory.includes('компас Элены');
            const hasKeyM = gameState.inventory.includes('ключ Марко');
            const hasBell = gameState.inventory.includes('серебряный колокольчик');
            const hasAllItems = hasCompass && hasKeyM && hasBell;
            
            const talkedCh2 = gameState.talkedToCh2.elena && gameState.talkedToCh2.marco && gameState.talkedToCh2.nina;
            
            if (!talkedCh2) {
                showNotification('Сфера не реагирует. Нужно узнать о ней больше от тех, кто здесь был.');
                return;
            }
            
            const sphereChoice = document.getElementById('dialogue-box');
            
            if (!hasAllItems) {
                sphereChoice.innerHTML = `
                    <div class="speaker-name">✦ Сердце Коллекции ✦</div>
                    <div class="dialogue-text">
                        Перед вами пульсирующая золотая сфера. Она излучает мощную энергию, но её защита слишком сильна.
                        <br><br>
                        <em style="color:#8a847a">Вам нужно собрать три артефакта, чтобы получить доступ к силе сферы:</em>
                        <br>
                        ${hasCompass ? '✅' : '❌'} Компас Элены — чтобы видеть путь сквозь иллюзии
                        <br>
                        ${hasKeyM ? '✅' : '❌'} Ключ Марко — чтобы отпереть замки коллекции
                        <br>
                        ${hasBell ? '✅' : '❌'} Серебряный колокольчик Нины — чтобы усмирить духов
                    </div>
                    <div class="choices">
                        <button class="choice-btn" onclick="endDialogue()">Продолжить поиски</button>
                    </div>
                `;
                sphereChoice.classList.add('visible');
                return;
            }
            
            sphereChoice.innerHTML = `
                <div class="speaker-name">✦ Сердце Коллекции ✦</div>
                <div class="dialogue-text">
                    Три артефакта загораются в ваших руках. Защита сферы падает.
                    Перед вами — пульсирующее сердце коллекции. В нём — сила сотен душ, 
                    воспоминания Маркуса и ключ к разгадке тайны этого места.
                    <br><br>
                    <em style="color:#d4af37">Последний выбор. Он определит всё...</em>
                </div>
                <div class="choices">
                    <button class="choice-btn" onclick="window.finishGame('destroy')">💥 Разбить сферу — освободить все души</button>
                    <button class="choice-btn" onclick="window.finishGame('seal')">🔒 Запечатать коллекцию навсегда</button>
                    <button class="choice-btn" onclick="window.finishGame('power')">🔥 Принять силу коллекции</button>
                    <button class="choice-btn" onclick="endDialogue()">Отойти и подумать</button>
                </div>
            `;
            sphereChoice.classList.add('visible');
        }
        
        window.finishGame = function(type) {
            const box = document.getElementById('dialogue-box');
            box.classList.remove('visible');
            setTimeout(() => applyEffect({ trigger: 'ending_' + type }), 300);
        };
        
        function createChapter2Objects() {
            // Golden sphere - the heart of the collection
            const sphereGroup = new THREE.Group();
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                emissive: 0xff6600,
                emissiveIntensity: 0.8,
                metalness: 0.9,
                roughness: 0.1
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 24), sphereMat);
            sphereGroup.add(sphere);
            
            // Glow aura
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = 128;
            glowCanvas.height = 128;
            const gCtx = glowCanvas.getContext('2d');
            const grad = gCtx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 200, 50, 0.3)');
            grad.addColorStop(0.5, 'rgba(255, 100, 0, 0.1)');
            grad.addColorStop(1, 'rgba(255, 50, 0, 0)');
            gCtx.fillStyle = grad;
            gCtx.fillRect(0, 0, 128, 128);
            
            const glowTex = new THREE.CanvasTexture(glowCanvas);
            const glowSprite = new THREE.Sprite(
                new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending })
            );
            glowSprite.scale.set(2, 2, 1);
            sphereGroup.add(glowSprite);
            
            sphereGroup.position.set(0, 0.8, -1.5);
            sphereGroup.userData = { id: 'golden_sphere', name: 'Сердце коллекции' };
            scene.add(sphereGroup);
            
            showNotification('Вы чувствуете присутствие чего-то могущественного в центре подвала...');
        }
        
        function transitionToChapter2() {
            gameState.chapter = 2;
            
            // Fade out effect
            const overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;opacity:0;transition:opacity 1.5s;pointer-events:none;';
            document.body.appendChild(overlay);
            setTimeout(() => overlay.style.opacity = '1', 100);
            
            setTimeout(() => {
                // Change scene atmosphere
                scene.background.setHex(0x050308);
                scene.fog.color.setHex(0x050308);
                scene.fog.density = 0.08;
                
                // Dim all lights
                scene.children.forEach(c => {
                    if (c.isLight) {
                        if (c.intensity > 1) c.intensity *= 0.5;
                        if (c.color) {
                            const hex = c.color.getHex();
                            c.color.setHex(hex); // keep same hue but dimmer
                        }
                    }
                });
                
                // Eerie purple ambient
                const ambient = new THREE.AmbientLight(0x1a0033, 0.4);
                scene.add(ambient);
                
                // Show chapter title
                const chTitle = document.getElementById('chapter-title');
                const chIndicator = document.getElementById('chapter-indicator');
                if (chTitle) {
                    chTitle.textContent = '— Глава 2: Подвал Маркуса —';
                    chTitle.classList.add('visible');
                }
                if (chIndicator) {
                    chIndicator.textContent = 'Глава 2: Подвал Маркуса';
                }
                
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.remove();
                        if (chTitle) chTitle.classList.remove('visible');
                        
                        // Show notification
                        showNotification('Подвал Маркуса. Будьте осторожны...');
                        
                        // Update hint
                        const hint = document.getElementById('click-hint');
                        if (hint) {
                            hint.textContent = 'Поговорите с персонажами в подвале';
                            hint.classList.add('visible');
                            setTimeout(() => hint.classList.remove('visible'), 8000);
                        }
                    }, 1500);
                }, 2500);
            }, 1500);
            
            // Add chapter 2 objects after transition
            setTimeout(() => createChapter2Objects(), 4000);
        }
        
        function triggerEnding(endingType) {
            gameState.ending = endingType;
            
            // Disable interaction
            npcs.forEach(npc => { npc.userData.lookAtPlayer = false; });
            
            let title, text, btnText;
            
            if (endingType === 'destroy') {
                title = '✧ Освобождение ✧';
                text = `Вы разбиваете золотую сферу. По подвалу проносится волна света. 
Коллекция рассыпается в пыль. Души, пленённые в ней, обретают свободу. 
Марко исчезает с улыбкой. Сергей приходит в себя. Нина плачет — но впервые за долгое время — от облегчения.
Кафе навсегда изменилось. Но вы чувствуете: вы сделали правильный выбор.`;
                btnText = 'Закончить историю';
            } else if (endingType === 'seal') {
                title = '🔒 Печать 🔒';
                text = `Вы запечатываете коллекцию, используя знания, полученные от Элены и Марко. 
Сфера гаснет, но не разрушается — она погружается в сон. 
Коллекция остаётся здесь, под кафе, но больше не угрожает никому. 
Нина наконец находит покой. Марко остаётся хранителем. А вы уходите в рассвет. 
Кафе продолжает работать — но теперь оно просто кафе.`;
                btnText = 'Закончить историю';
            } else if (endingType === 'power') {
                title = '🔥 Власть 🔥';
                text = `Вы принимаете дар коллекции. 
Сфера вливается в вас — вы чувствуете невероятную силу. 
Воспоминания сотен душ проносятся перед глазами. 
Марко в ужасе отступает. Нина кричит вам вслед. Элена исчезает. 
Вы выходите из кафе другим человеком. 
Коллекция теперь — часть вас. Но что вы будете делать с этой силой?`;
                btnText = 'Начать заново';
            } else {
                title = '✧ Судьба Кафе ✧';
                text = `Вы принимаете своё решение — не под давлением, не из страха, а по зову сердца.
Коллекция чувствует это. Она открывает вам тайну Маркуса: он не исчез, он стал частью коллекции — её хранителем.
Вы берёте его место? Или уходите, оставляя всё как есть?
Кафе продолжает жить. Тайна остаётся. И, может быть, когда-нибудь сюда придёт новый искатель...`;
                btnText = 'Начать заново';
            }
            
            const dialogueBox = document.getElementById('dialogue-box');
            dialogueBox.innerHTML = `
                <div class="speaker-name">${title}</div>
                <div class="dialogue-text">
                    ${text}
                    <br><br>
                    <em style="color:#8a847a">Отношения: Элена ${gameState.relationships.elena} · Марко ${gameState.relationships.marco} · Нина ${gameState.relationships.nina}</em>
                    <br>
                    <em style="color:#8a847a">Улик найдено: ${gameState.cluesFound}</em>
                </div>
                <div class="choices">
                    <button class="choice-btn" onclick="location.reload()">${btnText}</button>
                </div>
            `;
            dialogueBox.classList.add('visible');
        }
        
        function showEnding() {
            if (gameState.chapter === 1) {
                // Check requirements for basement access
                const talkedToAll = gameState.talkedTo.elena && gameState.talkedTo.marco && gameState.talkedTo.nina;
                const hasAmulet = gameState.inventory.includes('амулет защиты');
                const hasKey = gameState.inventory.includes('ключ');
                
                if (!talkedToAll) {
                    showNotification('Нужно поговорить со всеми посетителями кафе, прежде чем спускаться в подвал.');
                    return;
                }
                if (!hasAmulet) {
                    showNotification('Без защиты Нины в подвал лучше не соваться. Добудьте амулет.');
                    return;
                }
                if (!hasKey) {
                    showNotification('Дверь в подвал заперта. Нужен ключ.');
                    return;
                }
                transitionToChapter2();
            }
        }
        
        function startGame() {
            gameStarted = true;
            document.getElementById('intro').classList.add('hidden');
            updateNPCStatus();
            initAudio();
            
            document.getElementById('chapter-indicator').textContent = 'Глава 1: Ночное Кафе';
            document.getElementById('chapter-indicator').classList.add('visible');
            
            const hintElem = document.getElementById('click-hint');
            hintElem.textContent = 'Используйте клавиши A и D для осмотра. Кликните на персонажа для разговора.';
            
            // Show hint after a delay
            setTimeout(() => {
                hintElem.classList.add('visible');
            }, 2000);
            
            setTimeout(() => {
                hintElem.classList.remove('visible');
            }, 10000);
        }
        
        // Initialize on load
        window.onload = init;
    </script>
